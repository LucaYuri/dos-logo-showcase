<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo-Entwürfe für Verein «DOS»</title>
<meta name="description" content="Logo-Entwürfe für den Verein «DOS» (Deko und So)">
<link rel="icon" href="a_LucaYuri_Logo.PNG">
<style>
@font-face {
  font-family: "AvenirNext";
  src: url("AvenirNextLTPro-Regular.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --ink: #000;
  --paper: #fff;
  --mut: #6b6b6b;
  --soft: #c9c9c9;
  --mx: clamp(20px, 2.73vw, 41px);
  --col: 1087px;
  /* eine einzige Schriftgrösse für alles */
  --fs: clamp(14.7px, 1.68vw, 25.2px);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "AvenirNext", "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 400;
  font-style: normal;
  font-size: var(--fs);
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.page {
  max-width: 1504px;
  margin: 0 auto;
  padding: 0 var(--mx);
}

.col { max-width: var(--col); }

/* ---------- Kopf / Daten ---------- */

.head {
  padding-top: clamp(32px, 5.1vw, 77px);
  padding-bottom: clamp(80px, 20vw, 300px);
}

/* Logo als 8x8-Grid, shuffelt jede Sekunde neu */
.mark {
  display: block;
  width: clamp(88px, 9.8vw, 147px);
  height: auto;
}

.mark rect {
  transition: fill 620ms cubic-bezier(.4, 0, .2, 1);
}

.title {
  margin: clamp(18px, 1.9vw, 28px) 0 0;
  font-size: var(--fs);
  line-height: 1.14;
  letter-spacing: 0.005em;
  font-weight: 400;
}

.title a { color: inherit; text-decoration: none; }
.title a:hover { opacity: 0.5; }
.title .gap { display: block; height: 1.14em; }

/* ---------- Filter ---------- */

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--paper);
  margin-bottom: clamp(24px, 3vw, 44px);
}

.bar-in {
  max-width: 1504px;
  margin: 0 auto;
  padding: clamp(10px, 1vw, 14px) var(--mx);
  display: flex;
  gap: clamp(16px, 2vw, 28px);
  align-items: baseline;
  font-size: var(--fs);
}

.tab {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--mut);
  cursor: pointer;
  line-height: 1.3;
  transition: color .2s ease;
}

.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ink); }

/* ---------- Galerie ---------- */

.grid {
  display: flex;
  flex-direction: column;
  gap: clamp(40px, 6vw, 96px);
}

.card { max-width: var(--col); }

.shot {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 709 / 736;
  object-fit: fill;
  background: #f7f7f7;
}

.cap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-top: clamp(8px, 0.8vw, 12px);
  font-size: var(--fs);
  line-height: 1.3;
}

.cap .no { color: var(--ink); }

.fav {
  appearance: none;
  background: none;
  border: 0;
  padding: 8px;
  margin: -8px -8px -8px 0;
  font: inherit;
  cursor: pointer;
  display: inline-flex;
  line-height: 0;
}

.fav svg {
  width: calc(var(--fs) * 1.5);
  height: calc(var(--fs) * 1.5);
  display: block;
  fill: var(--soft);
  transition: fill .2s ease, transform .35s cubic-bezier(.34, 1.56, .64, 1);
}

.fav:hover svg { fill: var(--mut); }
.fav[aria-pressed="true"] svg { fill: var(--ink); transform: scale(1.1); }
.fav:active svg { transform: scale(.85); }

.empty {
  font-size: var(--fs);
  line-height: 1.14;
  color: var(--mut);
  padding: clamp(24px, 4vw, 60px) 0;
}

/* ---------- Fuss ---------- */

.foot {
  padding-top: clamp(64px, 9vw, 140px);
  padding-bottom: clamp(40px, 5vw, 72px);
}

.top {
  appearance: none;
  background: var(--ink);
  color: var(--paper);
  border: 0;
  border-radius: 999px;
  padding: clamp(12px, 1.1vw, 16px) clamp(22px, 2vw, 30px);
  font: inherit;
  font-size: var(--fs);
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  gap: 0.6em;
  align-items: center;
  transition: opacity .2s ease;
}

.top:hover { opacity: 0.7; }

.sig {
  margin-top: clamp(24px, 3vw, 40px);
  font-size: var(--fs);
  color: var(--mut);
}

.sig a { color: inherit; text-decoration: none; }
.sig a:hover { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .mark rect, .fav svg, .top, .tab { transition: none; }
}
</style>

</footer>

<script>
/* ---------- Logo-Grid: jede Sekunde neu mischen ---------- */
(function () {
  var COLORS = ["#356285","#25365c","#38688c","#a9b7d4","#a9d4ba","#356285","#54778a","#abbac2","#38688c","#63806e","#356285","#25365c","#63806e","#25365c","#c1e1f2","#25365c","#a9d4ba","#c1e1f2","#494f5c","#356285","#a9d4ba","#86d4a5","#25365c","#38688c","#a9b7d4","#494f5c","#25365c","#63806e","#c1e1f2","#63806e","#494f5c","#a9b7d4","#63806e","#a9d4ba","#25365c","#63806e","#a9d4ba","#494f5c","#25365c","#25365c","#356285","#a9d4cd","#a9b7d4","#a9d4cd","#a9d4cd","#494f5c","#25365c","#a9b7d4","#a9b7d4","#63806e","#a9b7d4","#356285","#a9d4cd","#a9d4cd","#a9d4ba","#63806e","#356285","#25365c","#54778a","#63806e","#a9b7d4","#a9d4cd","#a9d4cd","#25365c"];
  var cells = Array.prototype.slice.call(document.querySelectorAll("#mark rect"));
  if (!cells.length) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  function shuffle() {
    if (document.hidden) return;
    var p = COLORS.slice();
    for (var i = p.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = p[i]; p[i] = p[j]; p[j] = t;
    }
    for (var k = 0; k < cells.length; k++) cells[k].setAttribute("fill", p[k]);
  }

  setInterval(shuffle, 1000);
})();

/* ---------- Galerie + Favoriten ---------- */
(function () {
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4c.35 0 .67.2.83.52l2.6 5.27 5.82.85c.35.05.65.3.76.64.11.34.02.71-.23.96l-4.21 4.1.99 5.79c.06.35-.08.7-.37.91a.93.93 0 0 1-.98.07L12 18.78l-5.21 2.73a.93.93 0 0 1-.98-.07.93.93 0 0 1-.37-.9l.99-5.8-4.2-4.1a.93.93 0 0 1-.24-.96c.11-.34.41-.59.76-.64l5.81-.85 2.6-5.27c.16-.32.49-.52.84-.52z"/></svg>';

  var FILES = [];
  for (var i = 2; i <= 47; i++) FILES.push("Frame " + i + ".svg");

  var KEY = "dos-logo-favoriten";
  var favs = {};
  try { favs = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { favs = {}; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(favs)); } catch (e) {}
  }

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var tabAll = document.getElementById("tab-all");
  var tabFav = document.getElementById("tab-fav");
  var countAll = document.getElementById("count-all");
  var countFav = document.getElementById("count-fav");
  var onlyFavs = false;

  var cards = FILES.map(function (file, idx) {
    var no = String(idx + 1).padStart(2, "0");
    var id = file.replace(/\.svg$/, "");

    var card = document.createElement("article");
    card.className = "card";
    card.dataset.id = id;

    var img = document.createElement("img");
    img.className = "shot";
    img.src = "logos/" + encodeURIComponent(file);
    img.alt = "Logo-Entwurf " + no;
    img.width = 709;
    img.height = 736;
    img.loading = idx < 2 ? "eager" : "lazy";
    img.decoding = "async";

    var cap = document.createElement("div");
    cap.className = "cap";

    var label = document.createElement("span");
    label.className = "no";
    label.textContent = "Entwurf " + no;

    var btn = document.createElement("button");
    btn.className = "fav";
    btn.type = "button";
    btn.innerHTML = STAR;
    btn.addEventListener("click", function () {
      if (favs[id]) { delete favs[id]; } else { favs[id] = true; }
      save();
      paint(card, id);
      refresh();
    });

    cap.appendChild(label);
    cap.appendChild(btn);
    card.appendChild(img);
    card.appendChild(cap);
    grid.appendChild(card);

    paint(card, id);
    return card;
  });

  function paint(card, id) {
    var on = !!favs[id];
    var btn = card.querySelector(".fav");
    var name = card.querySelector(".no").textContent;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", (on ? "Favorit entfernen: " : "Favorisieren: ") + name);
    btn.title = on ? "Favorit entfernen" : "Favorisieren";
  }

  function refresh() {
    var n = 0;
    cards.forEach(function (card) {
      var on = !!favs[card.dataset.id];
      if (on) n++;
      card.hidden = onlyFavs && !on;
    });
    countAll.textContent = cards.length;
    countFav.textContent = n;
    tabAll.setAttribute("aria-pressed", onlyFavs ? "false" : "true");
    tabFav.setAttribute("aria-pressed", onlyFavs ? "true" : "false");
    empty.hidden = !(onlyFavs && n === 0);
  }

  tabAll.addEventListener("click", function () { onlyFavs = false; refresh(); });
  tabFav.addEventListener("click", function () { onlyFavs = true; refresh(); });

  document.getElementById("top").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    try { favs = JSON.parse(e.newValue) || {}; } catch (err) { favs = {}; }
    cards.forEach(function (card) { paint(card, card.dataset.id); });
    refresh();
  });

  refresh();
})();
</script>
