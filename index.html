<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo-Entwürfe für Verein «DOS»</title>
<meta name="description" content="Logo-Entwürfe für den Verein «DOS» (Deko und So)">
<link rel="icon" href="a_LucaYuri_Logo.PNG">
<style>
@font-face {
  font-family: "AvenirNext";
  src: url("AvenirNextLTPro-Regular.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --ink: #000;
  --paper: #fff;
  --mut: #6b6b6b;
  --soft: #c9c9c9;
  --gold: #ffc400;
  --mx: clamp(20px, 2.73vw, 41px);
  --col: 1087px;
  /* eine einzige Schriftgrösse für alles */
  --fs: clamp(14.7px, 1.68vw, 25.2px);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "AvenirNext", "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 400;
  font-style: normal;
  font-size: var(--fs);
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.page {
  max-width: 1504px;
  margin: 0 auto;
  padding: 0 var(--mx);
}

.col { max-width: var(--col); }

/* ---------- Kopf / Daten ---------- */

.head {
  padding-top: clamp(32px, 5.1vw, 77px);
  padding-bottom: clamp(80px, 20vw, 300px);
}

/* Logo als 8x8-Grid, shuffelt jede Sekunde neu */
.mark {
  display: block;
  width: clamp(88px, 9.8vw, 147px);
  height: auto;
}

.mark rect {
  transition: fill 620ms cubic-bezier(.4, 0, .2, 1);
}

.title {
  margin: clamp(18px, 1.9vw, 28px) 0 0;
  font-size: var(--fs);
  line-height: 1.14;
  letter-spacing: 0.005em;
  font-weight: 400;
}

.title a { color: inherit; text-decoration: none; }
.title a:hover { opacity: 0.5; }
.title .gap { display: block; height: 1.14em; }

/* ---------- Filter ---------- */

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--paper);
  margin-bottom: clamp(24px, 3vw, 44px);
}

.bar-in {
  max-width: 1504px;
  margin: 0 auto;
  padding: clamp(10px, 1vw, 14px) var(--mx);
  display: flex;
  gap: clamp(16px, 2vw, 28px);
  align-items: baseline;
  font-size: var(--fs);
}

.tab {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--mut);
  cursor: pointer;
  line-height: 1.3;
  transition: color .2s ease;
}

.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ink); }

/* ---------- Galerie ---------- */

.grid {
  display: flex;
  flex-direction: column;
  gap: clamp(40px, 6vw, 96px);
}

.card {
  max-width: var(--col);
  -webkit-user-select: none;
  user-select: none;
}

.shot {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 709 / 736;
  object-fit: fill;
  background: #f7f7f7;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-drag: none;
}

.cap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-top: clamp(8px, 0.8vw, 12px);
  font-size: var(--fs);
  line-height: 1.3;
}

.cap .no { color: var(--ink); }

.fav {
  appearance: none;
  background: none;
  border: 0;
  padding: 8px;
  margin: -8px -8px -8px 0;
  font: inherit;
  cursor: pointer;
  display: inline-flex;
  line-height: 0;
  position: relative;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  --star: calc(var(--fs) * 1.875);
}

.fav svg {
  width: var(--star);
  height: var(--star);
  display: block;
  fill: var(--soft);
  transform-origin: 50% 50%;
  position: relative;
  z-index: 1;
  transition: fill .25s ease, transform .35s cubic-bezier(.34, 1.56, .64, 1);
}

.fav:hover svg { fill: var(--mut); }
.fav:active svg { transform: scale(.82); }

.fav[aria-pressed="true"] svg {
  fill: var(--gold);
  transform: scale(1.1);
}

.fav[aria-pressed="true"]:hover svg { fill: #ffb300; }

/* ---- Effektebene: Schockwelle, Funken, Ringe ---- */

.fx {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  pointer-events: none;
}

.fx span,
.fx i {
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
  will-change: transform, opacity;
}

.fx .wave {
  width: calc(var(--star) * 1.6);
  height: calc(var(--star) * 1.6);
  margin: calc(var(--star) * -.8) 0 0 calc(var(--star) * -.8);
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 196, 0, 0) 46%,
    rgba(255, 196, 0, .75) 60%,
    rgba(255, 196, 0, 0) 76%);
}

.fx .flash {
  width: calc(var(--star) * 1.27);
  height: calc(var(--star) * 1.27);
  margin: calc(var(--star) * -.635) 0 0 calc(var(--star) * -.635);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 224, 120, .95) 0%, rgba(255, 196, 0, 0) 68%);
}

.fx i {
  width: var(--s);
  height: var(--s);
  margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  border-radius: 50%;
  background: var(--gold);
}

.fx i:nth-child(3n) { background: #ffe082; }
.fx i:nth-child(4n) { border-radius: 2px; }

.fav.pop svg { animation: starPop 780ms cubic-bezier(.3, 1.3, .45, 1) both; }
.fav.pop .wave { animation: wave 640ms cubic-bezier(.15, .75, .3, 1) both; }
.fav.pop .flash { animation: flash 520ms ease-out both; }
.fav.pop i { animation: spark var(--t) cubic-bezier(.15, .75, .3, 1) both; }

.fav.off svg { animation: starOff 420ms cubic-bezier(.4, 0, .2, 1) both; }

@keyframes starPop {
  0%   { transform: scale(1) rotate(0deg);        filter: drop-shadow(0 0 0 rgba(255, 196, 0, 0)); }
  13%  { transform: scale(.42) rotate(-45deg);    filter: drop-shadow(0 0 0 rgba(255, 196, 0, 0)); }
  40%  { transform: scale(1.7) rotate(205deg);    filter: drop-shadow(0 0 16px rgba(255, 196, 0, 1)); }
  62%  { transform: scale(.92) rotate(330deg); }
  80%  { transform: scale(1.22) rotate(372deg);   filter: drop-shadow(0 0 8px rgba(255, 196, 0, .55)); }
  100% { transform: scale(1.1) rotate(360deg);    filter: drop-shadow(0 0 0 rgba(255, 196, 0, 0)); }
}

@keyframes starOff {
  0%   { transform: scale(1.1) rotate(0deg); }
  45%  { transform: scale(.72) rotate(14deg); }
  100% { transform: scale(1) rotate(0deg); }
}

@keyframes wave {
  0%   { opacity: .9; transform: scale(.15); }
  100% { opacity: 0;  transform: scale(1.9); }
}

@keyframes flash {
  0%   { opacity: .9; transform: scale(.2); }
  100% { opacity: 0;  transform: scale(1.5); }
}

@keyframes spark {
  0% {
    opacity: 0;
    transform: rotate(var(--a)) translateY(calc(var(--star) * -.1)) scale(.2);
  }
  14% {
    opacity: 1;
    transform: rotate(var(--a)) translateY(calc(var(--d) * -.38)) scale(1.15);
  }
  72% {
    opacity: 1;
    transform: rotate(var(--a)) translateY(calc(var(--d) * -.86)) scale(.85);
  }
  100% {
    opacity: 0;
    transform: rotate(var(--a)) translateY(calc(var(--d) * -1.08)) scale(.25);
  }
}

.empty {
  font-size: var(--fs);
  line-height: 1.14;
  color: var(--mut);
  padding: clamp(24px, 4vw, 60px) 0;
}

/* ---------- Fuss ---------- */

.foot {
  padding-top: clamp(64px, 9vw, 140px);
  padding-bottom: clamp(40px, 5vw, 72px);
}

.top {
  appearance: none;
  background: var(--ink);
  color: var(--paper);
  border: 0;
  border-radius: 999px;
  padding: clamp(12px, 1.1vw, 16px) clamp(22px, 2vw, 30px);
  font: inherit;
  font-size: var(--fs);
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  gap: 0.6em;
  align-items: center;
  transition: opacity .2s ease;
}

.top:hover { opacity: 0.7; }

.sig {
  margin-top: clamp(24px, 3vw, 40px);
  font-size: var(--fs);
  color: var(--mut);
}

.sig a { color: inherit; text-decoration: none; }
.sig a:hover { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .mark rect, .fav svg, .top, .tab { transition: none; }
  .fav.pop svg, .fav.off svg, .fav.pop .wave, .fav.pop .flash, .fav.pop i { animation: none; }
  .fx { display: none; }
}
</style>
</head>

  if (!cells.length) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  function shuffle() {
    if (document.hidden) return;
    var p = COLORS.slice();
    for (var i = p.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = p[i]; p[i] = p[j]; p[j] = t;
    }
    for (var k = 0; k < cells.length; k++) cells[k].setAttribute("fill", p[k]);
  }

  setInterval(shuffle, 1000);
})();

  /* Doppelklick mit Maus, Doppeltipp auf dem Handy */
  function onDouble(el, fn) {
    el.addEventListener("dblclick", function (e) {
      e.preventDefault();
      fn();
    });

    var last = 0;
    el.addEventListener("pointerup", function (e) {
      if (e.pointerType === "mouse") return;
      var now = Date.now();
      if (now - last < 400) { last = 0; fn(); } else { last = now; }
    });
  }

  var cards = FILES.map(function (file, idx) {
    var no = String(idx + 1).padStart(2, "0");
    var id = file.replace(/\.svg$/, "");

    var card = document.createElement("article");
    card.className = "card";
    card.dataset.id = id;

    var img = document.createElement("img");
    img.className = "shot";
    img.src = "logos/" + encodeURIComponent(file);
    img.alt = "Logo-Entwurf " + no;
    img.width = 709;
    img.height = 736;
    img.loading = idx < 2 ? "eager" : "lazy";
    img.decoding = "async";

    var cap = document.createElement("div");
    cap.className = "cap";

    var label = document.createElement("span");
    label.className = "no";
    label.textContent = "Entwurf " + no;

    var btn = document.createElement("button");
    btn.className = "fav";
    btn.type = "button";
    btn.innerHTML = FX + STAR;

    function toggle() {
      var on = !favs[id];
      if (on) { favs[id] = true; } else { delete favs[id]; }
      save();
      paint(card, id);
      refresh();
      burst(btn, on);
    }

    /* Doppelklick auf den Entwurf oder auf den Stern */
    onDouble(img, toggle);
    onDouble(btn, toggle);

    /* Tastatur bleibt einfach bedienbar */
    btn.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });

    cap.appendChild(label);
    cap.appendChild(btn);
    card.appendChild(img);
    card.appendChild(cap);
    grid.appendChild(card);

    paint(card, id);
    return card;
  });

  var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function burst(btn, on) {
    if (REDUCED) return;
    btn.classList.remove("pop", "off");
    void btn.offsetWidth;            /* Reflow: Animation neu starten */
    btn.classList.add(on ? "pop" : "off");
    clearTimeout(btn._fx);
    btn._fx = setTimeout(function () { btn.classList.remove("pop", "off"); }, 900);
  }

  function paint(card, id) {
    var on = !!favs[id];
    var btn = card.querySelector(".fav");
    var name = card.querySelector(".no").textContent;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", (on ? "Favorit entfernen: " : "Favorisieren: ") + name);
    btn.title = on ? "Doppelklick entfernt den Favoriten" : "Doppelklick favorisiert";
    card.querySelector(".shot").title = btn.title;
  }

  function refresh() {
    var n = 0;
    cards.forEach(function (card) {
      var on = !!favs[card.dataset.id];
      if (on) n++;
      card.hidden = onlyFavs && !on;
    });
    countAll.textContent = cards.length;
    countFav.textContent = n;
    tabAll.setAttribute("aria-pressed", onlyFavs ? "false" : "true");
    tabFav.setAttribute("aria-pressed", onlyFavs ? "true" : "false");
    empty.hidden = !(onlyFavs && n === 0);
  }

  tabAll.addEventListener("click", function () { onlyFavs = false; refresh(); });
  tabFav.addEventListener("click", function () { onlyFavs = true; refresh(); });

  document.getElementById("top").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    try { favs = JSON.parse(e.newValue) || {}; } catch (err) { favs = {}; }
    cards.forEach(function (card) { paint(card, card.dataset.id); });
    refresh();
  });

  refresh();
})();
</script>
</body>
</html>
